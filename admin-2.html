<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Test Kabineti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1B2E;
    --bg-soft:#152540;
    --card:#1B2C4A;
    --card-border:#2A3E63;
    --gold:#F0A500;
    --gold-soft:#F7C24B;
    --text:#F4F6FB;
    --muted:#8CA0C2;
    --danger:#FF6B6B;
    --ok:#5FD08A;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(240,165,0,0.10), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    padding:24px;
  }
  h1,h2,h3{font-family:'Fraunces', serif; margin:0;}
  .wrap{max-width:720px; margin:0 auto;}
  .eyebrow{
    text-transform:uppercase; letter-spacing:.14em; font-size:12px;
    color:var(--gold-soft); font-weight:700; margin-bottom:8px;
  }
  .card{
    background:linear-gradient(180deg, var(--card), var(--bg-soft));
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:28px 24px;
    margin-bottom:20px;
  }
  label{
    display:block; font-size:12px; color:var(--muted); font-weight:700;
    text-transform:uppercase; letter-spacing:.08em; margin:14px 0 6px 0;
  }
  input, select{
    width:100%; padding:12px 14px; border-radius:10px;
    border:1px solid var(--card-border); background:#0F1B2E;
    color:var(--text); font-family:'Manrope', sans-serif; font-size:15px; outline:none;
  }
  input:focus, select:focus{border-color:var(--gold-soft);}
  .btn{
    display:block; width:100%; padding:14px 18px; border-radius:12px; border:none;
    font-family:'Manrope', sans-serif; font-size:15px; font-weight:700; cursor:pointer;
    background:linear-gradient(135deg, var(--gold-soft), var(--gold)); color:#241500;
    margin-top:18px;
  }
  .btn:disabled{opacity:.6;}
  .error{color:var(--danger); font-size:13px; margin-top:12px; display:none;}
  .error.show{display:block;}
  .success{color:var(--ok); font-size:13px; margin-top:12px; display:none;}
  .success.show{display:block;}
  .hidden{display:none !important;}

  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:14px;}
  th, td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--card-border);}
  th{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em;}
  .badge{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700;
  }
  .badge-sinov{background:rgba(95,208,138,.15); color:var(--ok);}
  .badge-dtm{background:rgba(240,165,0,.15); color:var(--gold-soft);}
  .badge-sertifikat{background:rgba(140,160,194,.15); color:var(--muted);}

  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .tabs{display:flex; gap:10px; margin-bottom:18px;}
  .tab-btn{
    flex:1; padding:12px; border-radius:10px; border:1px solid var(--card-border);
    background:transparent; color:var(--muted); font-family:'Manrope'; font-weight:700;
    font-size:13px; cursor:pointer;
  }
  .tab-btn.active{border-color:var(--gold-soft); color:var(--gold-soft); background:rgba(240,165,0,.08);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:20px 0;}
  .refresh-link{
    color:var(--gold-soft); font-size:13px; text-decoration:underline; cursor:pointer;
    background:none; border:none; padding:0;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ PAROL EKRANI ============ -->
  <div id="view-password" class="card">
    <div class="eyebrow">Admin Panel</div>
    <h1 style="font-size:24px; font-weight:600;">Kirish</h1>
    <label for="admin-password">Parol</label>
    <input id="admin-password" type="password" placeholder="Admin parolni kiriting">
    <button class="btn" onclick="adminLoginSubmit()" id="admin-login-btn">Kirish</button>
    <div class="error" id="password-error"></div>
  </div>

  <!-- ============ ADMIN PANEL ============ -->
  <div id="view-admin" class="card hidden">
    <div class="eyebrow">Admin Panel</div>
    <h1 style="font-size:24px; font-weight:600; margin-bottom:20px;">Boshqaruv</h1>

    <div class="tabs">
      <button class="tab-btn active" id="tab-btn-test" onclick="switchTab('test')">Test qo'shish</button>
      <button class="tab-btn" id="tab-btn-users" onclick="switchTab('users')">Foydalanuvchilar</button>
    </div>

    <!-- TEST QO'SHISH -->
    <div id="tab-test">
      <label for="test-turi">Test turi</label>
      <select id="test-turi" onchange="onTuriChange()">
        <option value="Sinov">Sinov testlar (bitta fan)</option>
        <option value="DTM">DTM testlar (ikki fan)</option>
        <option value="Sertifikat">Sertifikat testlar (bitta fan)</option>
      </select>

      <div class="row2" id="fan-row">
        <div>
          <label for="test-fan1">Fan 1</label>
          <input id="test-fan1" type="text" placeholder="Masalan: Matematika">
        </div>
        <div id="fan2-wrap" class="hidden">
          <label for="test-fan2">Fan 2</label>
          <input id="test-fan2" type="text" placeholder="Masalan: Fizika">
        </div>
      </div>

      <label for="test-sarlavha">Sarlavha</label>
      <input id="test-sarlavha" type="text" placeholder="Masalan: 2026-yil 1-blok">

      <button class="btn" onclick="addTestSubmit()" id="add-test-btn">Testni qo'shish</button>
      <div class="error" id="test-error"></div>
      <div class="success" id="test-success"></div>

      <h3 style="font-size:15px; margin-top:28px; color:var(--muted); font-weight:700;">Qo'shilgan testlar</h3>
      <table id="tests-table">
        <thead>
          <tr><th>ID</th><th>Turi</th><th>Fan(lar)</th><th>Sarlavha</th></tr>
        </thead>
        <tbody id="tests-tbody"></tbody>
      </table>
      <div class="empty hidden" id="tests-empty">Hozircha testlar qo'shilmagan.</div>
    </div>

    <!-- FOYDALANUVCHILAR -->
    <div id="tab-users" class="hidden">
      <button class="refresh-link" onclick="loadUsers()">↻ Yangilash</button>
      <table id="users-table">
        <thead>
          <tr><th>ID</th><th>Ism familiya</th><th>Telefon</th><th>Testlar</th><th>Foiz</th></tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
      <div class="empty hidden" id="users-empty">Hozircha foydalanuvchilar yo'q.</div>
    </div>
  </div>

</div>

<script>
/* MUHIM: shu URL API_URL bilan bir xil bo'lishi kerak (index.html dagi kabi) */
const API_URL = "https://script.google.com/macros/s/AKfycbxDG9OEvRcusYLoUgcObmccdWVwJrAsmiWtsDMmf3q_2h8dfrq5M28l3Un9blqh8dSG/exec";

let adminPassword = "";

async function adminLoginSubmit(){
  const pass = document.getElementById('admin-password').value.trim();
  const errEl = document.getElementById('password-error');
  errEl.classList.remove('show');

  if(!pass){
    errEl.textContent = "Parolni kiriting.";
    errEl.classList.add('show');
    return;
  }

  const btn = document.getElementById('admin-login-btn');
  btn.disabled = true;
  btn.textContent = "Tekshirilmoqda...";

  try{
    const res = await fetch(`${API_URL}?action=adminLogin&password=${encodeURIComponent(pass)}`);
    const data = await res.json();

    if(!data.success){
      errEl.textContent = data.message || "Parol noto'g'ri.";
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = "Kirish";
      return;
    }

    adminPassword = pass;
    document.getElementById('view-password').classList.add('hidden');
    document.getElementById('view-admin').classList.remove('hidden');
    loadTests();
  }catch(err){
    errEl.textContent = "Serverga ulanib bo'lmadi.";
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = "Kirish";
  }
}

function switchTab(name){
  document.getElementById('tab-test').classList.toggle('hidden', name !== 'test');
  document.getElementById('tab-users').classList.toggle('hidden', name !== 'users');
  document.getElementById('tab-btn-test').classList.toggle('active', name === 'test');
  document.getElementById('tab-btn-users').classList.toggle('active', name === 'users');
  if(name === 'users') loadUsers();
}

function onTuriChange(){
  const turi = document.getElementById('test-turi').value;
  document.getElementById('fan2-wrap').classList.toggle('hidden', turi !== 'DTM');
}

async function addTestSubmit(){
  const turi = document.getElementById('test-turi').value;
  const fan1 = document.getElementById('test-fan1').value.trim();
  const fan2 = document.getElementById('test-fan2').value.trim();
  const sarlavha = document.getElementById('test-sarlavha').value.trim();

  const errEl = document.getElementById('test-error');
  const okEl = document.getElementById('test-success');
  errEl.classList.remove('show');
  okEl.classList.remove('show');

  if(!fan1){
    errEl.textContent = "Fan nomini kiriting.";
    errEl.classList.add('show');
    return;
  }
  if(turi === 'DTM' && !fan2){
    errEl.textContent = "DTM testi uchun ikkinchi fan ham kerak.";
    errEl.classList.add('show');
    return;
  }

  const btn = document.getElementById('add-test-btn');
  btn.disabled = true;
  btn.textContent = "Qo'shilmoqda...";

  try{
    const url = `${API_URL}?action=addTest&password=${encodeURIComponent(adminPassword)}&turi=${encodeURIComponent(turi)}&fan1=${encodeURIComponent(fan1)}&fan2=${encodeURIComponent(fan2)}&sarlavha=${encodeURIComponent(sarlavha)}`;
    const res = await fetch(url);
    const data = await res.json();

    if(!data.success){
      errEl.textContent = data.message || "Xatolik yuz berdi.";
      errEl.classList.add('show');
      return;
    }

    okEl.textContent = `Test qo'shildi (ID: ${data.testId}).`;
    okEl.classList.add('show');
    document.getElementById('test-fan1').value = '';
    document.getElementById('test-fan2').value = '';
    document.getElementById('test-sarlavha').value = '';
    loadTests();
  }catch(err){
    errEl.textContent = "Serverga ulanib bo'lmadi.";
    errEl.classList.add('show');
  }finally{
    btn.disabled = false;
    btn.textContent = "Testni qo'shish";
  }
}

function badgeClass(turi){
  if(turi === 'Sinov') return 'badge-sinov';
  if(turi === 'DTM') return 'badge-dtm';
  return 'badge-sertifikat';
}

async function loadTests(){
  try{
    const res = await fetch(`${API_URL}?action=listTests&password=${encodeURIComponent(adminPassword)}`);
    const data = await res.json();
    const tbody = document.getElementById('tests-tbody');
    const empty = document.getElementById('tests-empty');
    tbody.innerHTML = '';

    if(!data.success || !data.tests || data.tests.length === 0){
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    data.tests.forEach(t => {
      const fanText = t.turi === 'DTM' ? `${t.fan1} + ${t.fan2}` : t.fan1;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${t.testId}</td>
        <td><span class="badge ${badgeClass(t.turi)}">${t.turi}</span></td>
        <td>${fanText}</td>
        <td>${t.sarlavha || '—'}</td>
      `;
      tbody.appendChild(tr);
    });
  }catch(err){
    console.error(err);
  }
}

async function loadUsers(){
  const tbody = document.getElementById('users-tbody');
  const empty = document.getElementById('users-empty');
  tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted);">Yuklanmoqda...</td></tr>';
  empty.classList.add('hidden');

  try{
    const res = await fetch(`${API_URL}?action=listUsers&password=${encodeURIComponent(adminPassword)}`);
    const data = await res.json();
    tbody.innerHTML = '';

    if(!data.success || !data.users || data.users.length === 0){
      empty.classList.remove('hidden');
      return;
    }

    data.users.forEach(u => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${u.id}</td>
        <td>${u.ism} ${u.familiya}</td>
        <td>${u.telefon}</td>
        <td>${u.umumiyTestlar}</td>
        <td>${u.umumiyFoiz}%</td>
      `;
      tbody.appendChild(tr);
    });
  }catch(err){
    tbody.innerHTML = '';
    empty.textContent = "Yuklashda xatolik yuz berdi.";
    empty.classList.remove('hidden');
  }
}
</script>
</body>
</html>
